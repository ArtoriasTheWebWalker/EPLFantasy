<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1322">
<title>FPL Companion · 2026/27</title>

<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/performance.css">
<link rel="stylesheet" href="css/draft.css">
<link rel="stylesheet" href="css/table.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span><span class="brand-name">FPL Companion</span>
    <button class="sync-btn" id="syncBtn" aria-label="Sync across devices" title="Sync across devices">☁</button>
    <span class="season" id="brandSeason">2026/27</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-page="performance">Performance</button>
    <button class="tab" data-page="draft">Draft</button>
    <button class="tab" data-page="table">Table &amp; fixtures</button>
  </nav>
</header>

<main>
  <!-- each page is fetched from pages/<name>.html and injected here -->
  <div class="page active" id="page-performance"></div>
  <div class="page" id="page-draft"></div>
  <div class="page" id="page-table"></div>
</main>

<footer>
  Personal planning tool · <span id="footSeason">2026/27</span> ·
  data from the official FPL API · notes saved in this browser
</footer>

<!-- shared modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modalBox">
    <button class="close-x" id="modalClose" aria-label="Close">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
