<?xml version="1.0" encoding="UTF-8"?>
<!--
  FPL Companion — app icon
  Polished from a user-authored draft. Same composition
  (clipboard → pitch → tactical play → captain → football → manager)
  with the stylus and headset dropped, the accent set trimmed to lime
  + cyan, and the captain C drawn as an SVG arc so no font fallback
  can render it as ©. Renders cleanly at 512, still legible at 60.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#070B14"/>
      <stop offset="50%"  stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E4FFA8"/>
      <stop offset="35%"  stop-color="#BEF264"/>
      <stop offset="70%"  stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#141E33"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>

    <radialGradient id="pitchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1E3A2F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09101C" stop-opacity="0"/>
    </radialGradient>

    <!-- ball: single radial sphere shading, no seam mesh -->
    <radialGradient id="ballShading" cx="32%" cy="28%" r="76%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#E4E7EA"/>
      <stop offset="85%"  stop-color="#8F97A0"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <radialGradient id="ballAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ballShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0"  stdDeviation="6"  flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ==================== Tile ==================== -->
  <rect x="18" y="18" width="476" height="476" rx="108"
        fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2.5"/>

  <!-- ==================== Clipboard bracket ==================== -->
  <g id="clipboard">
    <rect x="186" y="24" width="140" height="26" rx="8"
          fill="#131C2E" stroke="#334155" stroke-width="2"/>
    <rect x="216" y="14" width="80" height="14" rx="6"
          fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <circle cx="256" cy="21" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- ==================== Notebook sheet ==================== -->
  <g id="sheet">
    <rect x="52" y="44" width="408" height="416" rx="28"
          fill="url(#noteGrad)" stroke="#1E293B" stroke-width="2"/>
    <!-- one thin ruled band at top + bottom, no busy dashes, no red margin -->
    <line x1="72" y1="88"  x2="440" y2="88"
          stroke="#38BDF8" stroke-width="1.2" opacity="0.20"/>
    <line x1="72" y1="416" x2="440" y2="416"
          stroke="#38BDF8" stroke-width="1.2" opacity="0.20"/>
  </g>

  <!-- ==================== Pitch ==================== -->
  <g id="pitch" transform="translate(76 72)">
    <rect x="0" y="0" width="360" height="340" rx="20"
          fill="#0A1322" stroke="url(#limeGrad)" stroke-width="3.5"/>
    <rect x="4" y="4" width="352" height="332" rx="16" fill="url(#pitchGlow)"/>

    <!-- very faint mow bands -->
    <g opacity="0.06" fill="#A3E635">
      <rect x="0" y="0"   width="360" height="56"/>
      <rect x="0" y="112" width="360" height="56"/>
      <rect x="0" y="224" width="360" height="56"/>
    </g>

    <line x1="0" y1="170" x2="360" y2="170" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <circle cx="180" cy="170" r="54" fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <circle cx="180" cy="170" r="5" fill="#BEF264"/>

    <!-- top penalty area -->
    <rect x="80"  y="0"   width="200" height="74" fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <rect x="122" y="0"   width="116" height="28" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <path d="M 144 74 A 36 36 0 0 0 216 74" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <circle cx="180" cy="48" r="3.5" fill="#BEF264"/>

    <!-- bottom penalty area -->
    <rect x="80"  y="266" width="200" height="74" fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <rect x="122" y="312" width="116" height="28" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <path d="M 144 266 A 36 36 0 0 1 216 266" fill="none" stroke="url(#limeGrad)" stroke-width="2"/>
    <circle cx="180" cy="292" r="3.5" fill="#BEF264"/>

    <!-- corner arcs -->
    <path d="M 0   16  A 16 16 0 0 0 16  0"   fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <path d="M 344 0   A 16 16 0 0 0 360 16"  fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <path d="M 0   324 A 16 16 0 0 1 16  340" fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
    <path d="M 344 340 A 16 16 0 0 1 360 324" fill="none" stroke="url(#limeGrad)" stroke-width="2.5"/>
  </g>

  <!-- ==================== The manager's play ==================== -->
  <g id="play" filter="url(#neonGlow)">
    <path d="M 170 310 Q 230 250 215 195 T 310 125"
          fill="none" stroke="#38BDF8" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="6 6"/>
    <polygon points="318,120 306,118 310,130" fill="#38BDF8"/>

    <circle cx="150" cy="310" r="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="215" cy="195" r="5" fill="#0F172A" stroke="#BEF264" stroke-width="2.5"/>

    <!-- Captain badge: dark disc + lime ring + a real C drawn as an arc
         (no font fallback, no ©) -->
    <g transform="translate(315 122)">
      <circle r="14" fill="#0F172A" stroke="url(#limeGrad)" stroke-width="2"/>
      <path d="M 5 -7 A 8 8 0 1 0 5 7"
            fill="none" stroke="#BEF264" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== Football ==================== -->
  <g id="football" transform="translate(362 185)" filter="url(#ballShadow)">
    <defs>
      <clipPath id="ballClip"><circle cx="0" cy="0" r="44"/></clipPath>
    </defs>

    <circle r="46" fill="none" stroke="url(#cyanGrad)" stroke-width="1.8" opacity="0.85"/>

    <g clip-path="url(#ballClip)">
      <circle r="44" fill="url(#ballShading)"/>

      <!-- one central pentagon, plus three peripheral marks —
           enough to read as a football, not a seam mesh that muddies at scale -->
      <path d="M 0 -18
               C 8 -17 15 -12 18 -6
               C 18 3 14 12 10 15
               C 4 15 -4 15 -10 15
               C -14 12 -18 3 -18 -6
               C -15 -12 -8 -17 0 -18 Z"
            fill="#0F172A" stroke="#020617" stroke-width="1.2"/>

      <path d="M -10 -36 C -5 -35 4 -35 9 -36 L 15 -44 C 5 -45 -5 -45 -16 -44 Z"
            fill="#0F172A" opacity="0.9"/>
      <path d="M 22 23 C 27 21 32 18 36 15 L 43 26 C 39 32 33 37 26 40 L 22 30 Z"
            fill="#0F172A" opacity="0.9"/>
      <path d="M -22 23 C -27 21 -32 18 -36 15 L -43 26 C -39 32 -33 37 -26 40 L -22 30 Z"
            fill="#0F172A" opacity="0.9"/>

      <!-- ambient darkening at the rim -->
      <circle r="44" fill="url(#ballAmbient)"/>

      <!-- one clean specular highlight -->
      <ellipse cx="-14" cy="-16" rx="14" ry="8"
               fill="#FFFFFF" opacity="0.55" transform="rotate(-28 -14 -16)"/>
    </g>

    <circle r="44" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ==================== Manager ==================== -->
  <g id="manager" transform="translate(108 335)" filter="url(#neonGlow)">
    <ellipse cx="40" cy="98" rx="48" ry="12"
             fill="#050912" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

    <!-- coat / shoulder silhouette -->
    <path d="M 0 102 C 0 74 18 56 40 50 C 62 56 80 74 80 102 Z"
          fill="#080E1A" stroke="url(#limeGrad)" stroke-width="2.5"/>

    <!-- collar V + tie -->
    <path d="M 33 58 L 40 70 L 47 58" fill="none"
          stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="40,73 44,98 36,98" fill="url(#limeGrad)" opacity="0.85"/>

    <!-- head -->
    <circle cx="40" cy="30" r="18" fill="#0B1424" stroke="url(#limeGrad)" stroke-width="2.5"/>
  </g>
</svg>
