<div id="draftBanner"></div>

<section>
  <div class="sec-head">
    <h2><span class="tag">Season view</span>Draft board</h2>
  </div>

  <div class="pitch" id="draftPitch"><div class="goalmouth"></div></div>

  <div class="bench">
    <div class="mini-title">Bench</div>
    <div class="bench-row" id="draftBench"></div>
  </div>

  <div class="legend">
    <span><i style="background:var(--blue)"></i>Exceptional</span>
    <span><i style="background:var(--green)"></i>Good</span>
    <span><i style="background:var(--amber)"></i>Average</span>
    <span><i style="background:var(--red)"></i>Underperformed</span>
    <span style="opacity:.6">·</span>
    <span>Flag shown under each shirt</span>
  </div>
</section>

<section>
  <div class="sec-head">
    <h2><span class="tag">Watchlist</span>Players I'm considering</h2>
  </div>
  <div id="candidateArea"></div>
</section>
